# Kept deliberately modest: the Flutter template ships -Xmx8G, which lets the
# Gradle daemon sit on several GB between builds.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
