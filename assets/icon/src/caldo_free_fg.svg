<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The page alone, on nothing: the Samsung calendar it is drawn from is
       a page standing free inside its icon's room, with the rings rising
       above the header, not a sheet that fills the launcher's shape. Every
       edge is measured off a screenshot of the two side by side, taking the
       launcher's squircle as the middle 72dp of this layer. -->
  <defs>
    <!-- One shape, coloured in two: a red header drawn over a pale sheet
         of the same outline let the sheet's anti-aliased edge show
         through the header's, a light rim round its top corners. -->
    <linearGradient id="page" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0.351562" stop-color="#DE414A"/>
      <stop offset="0.351562" stop-color="#CAD6DA"/>
    </linearGradient>
  </defs>
  <rect x="214" y="240" width="596" height="539" rx="72" fill="url(#page)"/>
  <g fill="#243044">
    <rect x="305" y="183" width="42" height="94" rx="12"/>
    <rect x="491" y="183" width="42" height="94" rx="12"/>
    <rect x="677" y="183" width="42" height="94" rx="12"/>
  </g>
</svg>
