<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android's themed icon: one colour, so the header is told from the
       sheet by a seam cut between them, and the rings by a gap cut round
       each where it crosses the header. -->
  <defs>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <rect x="242" y="393" width="540" height="18" fill="#000000"/>
      <g fill="#000000">
        <rect x="314" y="231" width="60" height="118" rx="22"/>
        <rect x="482" y="231" width="60" height="118" rx="22"/>
        <rect x="650" y="231" width="60" height="118" rx="22"/>
      </g>
    </mask>
  </defs>
  <g fill="#FFFFFF">
    <rect x="242" y="289" width="540" height="492" rx="52" mask="url(#cut)"/>
    <rect x="326" y="243" width="36" height="94" rx="10"/>
    <rect x="494" y="243" width="36" height="94" rx="10"/>
    <rect x="662" y="243" width="36" height="94" rx="10"/>
  </g>
</svg>
