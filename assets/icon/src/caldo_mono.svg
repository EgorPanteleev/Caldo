<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android's themed icon: one colour, so the header is told from the
       sheet by a seam cut between them, and the rings by a gap cut round
       each where it crosses the header. -->
  <defs>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <rect x="205" y="377" width="614" height="20" fill="#000000"/>
      <g fill="#000000">
        <rect x="287" y="192" width="69" height="135" rx="25"/>
        <rect x="478" y="192" width="69" height="135" rx="25"/>
        <rect x="669" y="192" width="69" height="135" rx="25"/>
      </g>
    </mask>
  </defs>
  <g fill="#FFFFFF">
    <rect x="205" y="258" width="614" height="560" rx="59" mask="url(#cut)"/>
    <rect x="301" y="206" width="41" height="107" rx="11"/>
    <rect x="492" y="206" width="41" height="107" rx="11"/>
    <rect x="683" y="206" width="41" height="107" rx="11"/>
  </g>
</svg>
