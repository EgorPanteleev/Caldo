<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The page is the whole icon: the background layer is the sheet's
       colour, so whatever shape the launcher cuts out is the page, and this
       layer is its red header and the three rings in it. The rings keep to
       where a round mask still leaves the header whole. -->
  <rect width="1024" height="355" fill="#E04545"/>
  <g fill="#1F2B4A">
    <rect x="312" y="228" width="47" height="102" rx="13"/>
    <rect x="489" y="228" width="47" height="102" rx="13"/>
    <rect x="666" y="228" width="47" height="102" rx="13"/>
  </g>
</svg>
