<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A calendar page and nothing behind it: the sheet is the icon's
       shape, as the reference's was. Its pale sheet, its red header, and
       three rings standing up out of the header, flat. -->
  <g transform="translate(512 512) scale(1.5) translate(-512 -512)">
  <defs>
    <!-- One shape, coloured in two: a red header drawn over a pale sheet
         of the same outline let the sheet's anti-aliased edge show
         through the header's, a light rim round its top corners. -->
    <linearGradient id="page" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0.376953" stop-color="#E04545"/>
      <stop offset="0.376953" stop-color="#CAD6DA"/>
    </linearGradient>
  </defs>
  <rect x="205" y="258" width="614" height="560" rx="59" fill="url(#page)"/>
  <g fill="#1F2B4A">
    <rect x="301" y="206" width="41" height="107" rx="11"/>
    <rect x="492" y="206" width="41" height="107" rx="11"/>
    <rect x="683" y="206" width="41" height="107" rx="11"/>
  </g>
  </g>
</svg>
