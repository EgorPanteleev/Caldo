<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3A42"/><stop offset="1" stop-color="#26262C"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9C87F0"/><stop offset="1" stop-color="#5B4BC4"/></linearGradient></defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- The page: a calendar sheet with its two rings and the days in a grid. -->
  <rect x="190" y="250" width="500" height="500" rx="76" fill="#FFFFFF"/>
  <path d="M190 326 a76 76 0 0 1 76 -76 h348 a76 76 0 0 1 76 76 v58 h-500 z" fill="#E4E4EA"/>
  <rect x="300" y="196" width="44" height="116" rx="22" fill="#3A3A42"/>
  <rect x="536" y="196" width="44" height="116" rx="22" fill="#3A3A42"/>
  <g fill="#C8C8D0">
    <rect x="250" y="440" width="64" height="52" rx="14"/>
    <rect x="345" y="440" width="64" height="52" rx="14"/>
    <rect x="440" y="440" width="64" height="52" rx="14"/>
    <rect x="535" y="440" width="64" height="52" rx="14"/>
    <rect x="250" y="530" width="64" height="52" rx="14"/>
    <rect x="345" y="530" width="64" height="52" rx="14"/>
    <rect x="250" y="620" width="64" height="52" rx="14"/>
    <rect x="345" y="620" width="64" height="52" rx="14"/>
  </g>
  <!-- The tick: a done task's filled square, laid over the page's corner. -->
  <rect x="468" y="468" width="366" height="366" rx="84" fill="url(#accent)" stroke="#26262C" stroke-width="10"/>
  <path d="M563 658 L629 724 L746 585" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
